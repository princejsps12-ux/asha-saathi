# Lint, format check and every test on each push and pull request, plus the same Docker build a judge runs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Frontend (ESLint + Prettier + vitest + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  judge-test:
    name: judge-test (fresh checkout, no .env, no secrets, README command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # fresh checkout of this commit

      - name: Confirm there is no .env file and no API keys
        run: |
          if [ -e .env ]; then echo "FAIL: .env exists"; exit 1; fi
          if env | grep -E '^(SARVAM|GEMINI)_'; then echo "FAIL: API key variables are set"; exit 1; fi
          echo "OK: no .env file, no SARVAM_* / GEMINI_* variables; this job uses no secrets"

      - name: docker compose up -d --build (exactly as the README says)
        run: docker compose up -d --build

      - name: Wait until the app responds on the compose port
        run: |
          PORT=$(docker compose port app 8000 | cut -d: -f2)
          echo "compose port: $PORT"
          echo "APP=http://localhost:$PORT" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -sf "http://localhost:$PORT/api/health" >/dev/null; then
              echo "::notice title=judge-test: app is up::Answered on compose port $PORT after ~$((i * 2)) s, no .env, no secrets"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: app did not answer on port $PORT"; docker compose logs app; exit 1

      - name: Main page is our app, not a default page
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          curl -sf "$APP/" -o page.html || fail "main page did not load"
          grep -q '<title>ASHA Saathi · आशा साथी</title>' page.html || fail "page title is not ASHA Saathi"
          echo "OK: title is 'ASHA Saathi · आशा साथी'"
          grep -q '<div id="root">' page.html || fail "React mount point missing"
          JS=$(grep -o '/assets/index-[A-Za-z0-9_-]*[.]js' page.html | head -1)
          [ -n "$JS" ] || fail "no app bundle referenced"
          curl -sf "$APP$JS" | grep -q 'नमूना' || fail "app bundle $JS missing or not our app"
          echo "OK: app bundle $JS loads and contains our Hindi UI"
          curl -sf "$APP/api/status" | grep -q '"offline_mode":true' || fail "not in no-key mode"
          echo "OK: running in no-key mode"
          echo "::notice title=judge-test: main page::Title 'ASHA Saathi · आशा साथी', our bundle $JS loads, no-key mode"

      - name: Extract API parses BP 150/100 from a Hindi sentence
        run: |
          SENTENCE='सुनीता साहू सात महीने की गर्भवती है, बीपी 150 बाय 100 है, पैरों में सूजन है'
          echo "sentence: $SENTENCE"
          jq -n --arg t "$SENTENCE" '{transcript: $t}' > body.json
          curl -sf -X POST "$APP/api/extract" -H 'content-type: application/json' --data @body.json -o result.json
          jq '{bp: "\(.fields.bp_systolic)/\(.fields.bp_diastolic)", month: .fields.pregnancy_month,
               woman: .fields.beneficiary_name_en, risk, alerts: [.alerts[].title_en]}' result.json
          BP=$(jq -r '"\(.fields.bp_systolic)/\(.fields.bp_diastolic)"' result.json)
          if [ "$BP" != "150/100" ]; then echo "FAIL: expected BP 150/100, got $BP"; exit 1; fi
          echo "OK: BP 150/100 parsed from the Hindi sentence"
          SUMMARY=$(jq -c '{bp: "\(.fields.bp_systolic)/\(.fields.bp_diastolic)", month: .fields.pregnancy_month, woman: .fields.beneficiary_name_en, risk}' result.json)
          echo "::notice title=judge-test: extract API::'$SENTENCE' -> $SUMMARY"

      - name: docker compose down
        if: always()
        run: docker compose down

  judge-amd64:
    name: Judge run on linux/amd64 (fresh clone, no cache, no keys, sample chip in Chrome)
    runs-on: ubuntu-latest # a real x86_64 machine: no emulation
    needs: [backend, frontend]
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      COMPOSE_PROJECT_NAME: asha-saathi
    steps:
      - name: Fresh clone, exactly as in the README
        run: |
          git clone ${{ github.server_url }}/${{ github.repository }}.git asha-saathi
          cd asha-saathi && git checkout --quiet ${{ github.sha }}
          test ! -e .env && echo "no .env file"
          env | grep -E '^(SARVAM|GEMINI)_' && exit 1 || echo "no API keys in the environment"
      - name: Clear the build cache and build with --no-cache
        working-directory: asha-saathi
        run: |
          uname -m
          docker builder prune -af
          docker compose build --no-cache
          docker image inspect asha-saathi-app --format 'image platform: {{.Os}}/{{.Architecture}}'
      - name: docker compose up and wait for the printed URL
        working-directory: asha-saathi
        run: |
          docker compose up -d
          for i in $(seq 1 60); do docker compose logs app | grep -q 'open  http://localhost:8000' && break; sleep 2; done
          docker compose logs app | grep -E 'is running|No-key mode'
          curl -sf http://localhost:8000/api/status | grep -q '"offline_mode":true'
      - name: Open the app in Chrome and tap a sample chip
        run: |
          mkdir judge && cd judge && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer-core@23.11.1 >/dev/null
          cp ../asha-saathi/.github/scripts/judge-check.mjs . && node judge-check.mjs http://localhost:8000
      - if: always()
        working-directory: asha-saathi
        run: docker compose logs --no-color | tail -40

  windows:
    name: Windows (PowerShell 5.1, Git defaults, README steps)
    runs-on: windows-latest
    defaults: { run: { shell: powershell } } # Windows PowerShell 5.1, not pwsh
    steps:
      - name: Clone with Git for Windows' default line-ending setting, as in the README
        run: |
          $ErrorActionPreference = 'Continue' # judge success by exit codes, not by stderr chatter
          $PSVersionTable.PSVersion.ToString()
          git config --global core.autocrlf true
          git clone -q ${{ github.server_url }}/${{ github.repository }}.git
          cd asha-saathi
          git checkout --quiet ${{ github.sha }}
          $crlf = git ls-files --eol | Select-String 'w/crlf'
          if ($crlf) { $crlf; throw "files were checked out with CRLF line endings" }
          "all text files checked out with LF"
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Frontend lint + Prettier + tests on the Windows checkout
        working-directory: asha-saathi/frontend
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit 1 }
          npm run lint
          if ($LASTEXITCODE) { exit 1 }
          npm test
          if ($LASTEXITCODE) { exit 1 }
      - name: Backend ruff + tests on the Windows checkout
        working-directory: asha-saathi/backend
        run: |
          $ErrorActionPreference = 'Continue'
          pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit 1 }
          ruff check .
          if ($LASTEXITCODE) { exit 1 }
          ruff format --check .
          if ($LASTEXITCODE) { exit 1 }
          pytest
          if ($LASTEXITCODE) { exit 1 }
      - name: README's PowerShell port command gives the right compose port
        working-directory: asha-saathi
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PORT = "9000"; docker compose config | Select-String '9000'
          if (-not (docker compose config | Select-String 'published: "9000"')) { throw "PORT was not applied" }
