# Lint, format check and every test on each push and pull request, plus the same Docker build a judge runs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Frontend (ESLint + Prettier + vitest + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build + health check (no keys)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (exactly as in the README)
        run: docker compose up -d --build
      - name: Wait for the app and check the API and the page
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf http://localhost:8000/api/status | grep -q '"offline_mode":true'
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
      - if: always()
        run: docker compose logs --no-color | tail -50
